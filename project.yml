name: CodigoBrasil
options:
  bundleIdPrefix: com.murillotorres
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
settings:
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
configFiles:
  Debug: CodigoBrasil/Config/Local.xcconfig
  Release: CodigoBrasil/Config/Local.xcconfig
targets:
  CodigoBrasil:
    type: application
    platform: iOS
    sources:
      - path: CodigoBrasil
    info:
      path: CodigoBrasil/Info.plist
      properties:
        CFBundleDisplayName: "Código Brasil"
        UILaunchScreen:
          UIColorName: FundoAbertura
          UIImageName: LogoAbertura
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.murillotorres.codigobrasil
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"CodigoBrasil/Preview Content\""
        ENABLE_PREVIEWS: YES
