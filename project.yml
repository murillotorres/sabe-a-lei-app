name: SabeALei
options:
  bundleIdPrefix: com.murillotorres
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
settings:
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
configFiles:
  Debug: SabeALei/Config/Local.xcconfig
  Release: SabeALei/Config/Local.xcconfig
targets:
  SabeALei:
    type: application
    platform: iOS
    sources:
      - path: SabeALei
    info:
      path: SabeALei/Info.plist
      properties:
        CFBundleDisplayName: "Sabe a Lei"
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.murillotorres.sabealei
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"SabeALei/Preview Content\""
        ENABLE_PREVIEWS: YES
